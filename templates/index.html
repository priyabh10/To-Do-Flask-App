<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flask To-Do App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">📝 Flask To-Do App</h2>

    <!-- Add Task -->
    <form method="POST" action="/add" class="d-flex mb-4">
        <input type="text" name="title" class="form-control me-2" placeholder="Enter task" required>
        <button class="btn btn-primary">Add</button>
    </form>

    <!-- Task List -->
    <ul class="list-group">
        {% for task in tasks %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {% if task.completed %}
                    <span class="text-decoration-line-through text-muted">{{ task.title }}</span>
                {% else %}
                    <span>{{ task.title }}</span>
                {% endif %}

                <div>
                    {% if not task.completed %}
                        <a href="/complete/{{ task.id }}" class="btn btn-success btn-sm">✔</a>
                    {% endif %}
                    <a href="/delete/{{ task.id }}" class="btn btn-danger btn-sm">✖</a>
                </div>
            </li>
        {% endfor %}
    </ul>
</div>

</body>
</html>
